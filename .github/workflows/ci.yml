name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install bash 5 (macOS ships 3.2)
        if: runner.os == 'macOS'
        run: brew install bash
      - name: ShellCheck
        run: shellcheck gham install.sh tests/*.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Smoke tests
        run: bash ./tests/smoke.sh
      # macOS ships bash 3.2 as /bin/bash. Put it first on PATH so gham's
      # `#!/usr/bin/env bash` runs under it too, not a Homebrew bash 5.
      - name: Smoke tests on macOS's bash 3.2
        if: runner.os == 'macOS'
        run: PATH="/bin:$PATH" /bin/bash ./tests/smoke.sh
